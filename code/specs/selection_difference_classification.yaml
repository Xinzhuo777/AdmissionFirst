schema: caprls-selection-difference-classification-v1
authority: predeclared experiment protocol
role: pre_signed_human_classification_intake
binding_rule: 'The harness NEVER self-classifies. On selection_identity: differs it may set selection_difference_cause from this table ONLY when the observed template is in that cell''s admissible_observed_templates. Every other difference sets unknown and REFUSES, as required by the declared protocol.'
default_for_unlisted_cells: unknown_refuse
forbidden:
- no VACUUM of auth_idx
- no per-cell artifact tables
- no statistics pinning
- no planner-input change of any kind to make selections match the frozen assignment
- no re-running to obtain a better selection_identity_same n
forbidden_rationale: adopting such a change after observing that it favours the frozen template is not permitted by the declared protocol
scope:
  classified_cells: 11
  classified_scope: the 11 E3 group_acl_expensive cells
  unlisted_cells: 41
  unlisted_behaviour: unknown => refuse
  robust_e3_cells: '22 of 33: cheap_tenant_sargable builds no artifact, and hybrid_selective_key wins by orders of magnitude'
  e10_structural_exposure: Q3/Q9 (auth_index_enum_v1) and Q2/Q7 (mav_scan_v1) are structurally exposed to the same mechanism; not pre-classified, so a divergence there refuses
