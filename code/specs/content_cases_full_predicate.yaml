shared_inputs:
- input: policy predicate template
  location: manifests/policies/synthetic_saas_policies.yaml (E2/E10); caprls_core/e3_main.py:3256-3308 (E3)
  consequence: a wrong policy is invisible on both sides
- input: context row
  location: public.synthetic_context via oracle_audit._load_context; frozen bindings user_id=90, ctx_tenant_id=90, region_2, purpose_2
  consequence: a wrong context literal is invisible on both sides
- input: execution timestamp literal
  location: hard-coded '2026-06-01 00:00:00+00' in oracle_audit.py:87 and e10_study.py:7669
  consequence: the share_acl validity window is evaluated identically; recorded as context_binding_digest because nothing pins it
- input: boundary column contract
  location: E3_CARRIER_PROJECTION_COLUMNS / per-cell transcription
  consequence: a wrong declared schema is invisible on both sides
- input: E2 frozen predicate is unrecoverable
  location: the frozen E2 record carries no predicate text anywhere
  consequence: 'for those 8 cells reconciliation is possible only against a live re-render; reference_renderer_shared_with_candidate: false holds at the rendered-text level only'
renderer_divergence:
  finding: the two in-repo policy renderers disagree on timestamptz literal syntax
  oracle_audit: '''2026-06-01 00:00:00+00''::timestamptz  (oracle_audit._sql_literal, used by E2)'
  e10_study: TIMESTAMPTZ '2026-06-01 00:00:00+00'  (e10_study._render_policy_predicate)
  consequence: the reference generator renders the declared per-family form so that predicate_text_reconciliation compares like with like; the declared form is an audited constant, so a change in either renderer is caught
  semantics: identical; only the literal syntax differs
digest_encodings:
  plain_sha256_utf8: '''sha256:'' + sha256(text.encode(''utf-8'')).hexdigest()'
  canonical_json_exact_runner_sql: '''sha256:'' + sha256(json.dumps({''exact_runner_sql'': text}, sort_keys=True, separators=('','','':''), ensure_ascii=True)).hexdigest()  # planner/root_selection.py:_digest'
  canonical_json_runner_sql: '''sha256:'' + sha256(json.dumps({''runner_sql'': text}, sort_keys=True, separators=('','','':'')).encode(''utf-8'')).hexdigest()  # caprls_core/e10_study.py:1434-1436'
  canonical_row_texts_v1: '''''.join(''%016x:'' % len(row.encode(''utf-8'')) + row for row in sorted(rows)); ''sha256:'' + sha256(that.encode(''utf-8'')).hexdigest()  # e3_sigmod_preview.canonical_result_from_row_texts'
gucs:
- search_path
- jit
- max_parallel_workers_per_gather
- plan_cache_mode
- row_security
- DateStyle
- IntervalStyle
- TimeZone
- extra_float_digits
- lc_numeric
- lc_monetary
- lc_time
- bytea_output
- client_encoding
- standard_conforming_strings
- client_min_messages
