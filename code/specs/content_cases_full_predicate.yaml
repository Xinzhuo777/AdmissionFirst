  - job_cast_info
  - job_movie_companies
carries_query_predicate:
- n: 1
  template_id: barrier_filter_v1
  emitter: _lower_barrier_filter
  carries_query_predicate: 'no'
  lands: auth CTE carries exact_predicate_for only
  evidence: planner/emit.py:887
  in_default_registry: true
- n: 2
  template_id: barrier_filter_inline_v1
  emitter: _lower_inline_barrier_filter
  carries_query_predicate: 'no'
  lands: same, NOT MATERIALIZED
  evidence: planner/emit.py:903
  in_default_registry: true
- n: 3
  template_id: safe_predicate_injection_v1
  emitter: _lower_safe_predicate_injection
  carries_query_predicate: 'yes'
  lands: 'inside access root; conjunct #1 of WHERE {query} AND {exact}'
  evidence: planner/emit.py:917
  in_default_registry: true
- n: 4
  template_id: native_pg_rls_v1
  emitter: _lower_native_pg_rls
  carries_query_predicate: 'yes'
  lands: inside access root; the only WHERE (engine enforces the policy)
  evidence: planner/emit.py:990
  in_default_registry: true
- n: 5
  template_id: raw_pushdown_positive_control_v1
  emitter: _lower_diagnostic_only_scan
  carries_query_predicate: 'no'
  lands: bare scan; not in the default registry
  evidence: planner/emit.py:945-949
  in_default_registry: false
- n: 6
  template_id: ordinary_first_exact_check_v1
  emitter: _lower_ordinary_first_exact_check
  carries_query_predicate: 'yes'
  lands: 'delegates to _lower_safe_predicate_injection; SQL byte-identical to #3'
  evidence: planner/emit.py:928 -> 917
  in_default_registry: true
- n: 7
  template_id: auth_view_scan_v1
  emitter: _lower_auth_view_scan
  carries_query_predicate: 'no'
  lands: SELECT ... FROM {view}, no WHERE at all
  evidence: planner/emit.py:1022-1025
  in_default_registry: true
- n: 8
  template_id: auth_index_enum_v1
  emitter: _lower_auth_index_enum
  carries_query_predicate: 'no'
  lands: WHERE holds artifact-scope conditions only
  evidence: planner/emit.py:1046,1052
  in_default_registry: true
- n: 9
  template_id: auth_index_semijoin_v1
  emitter: _lower_auth_index_semijoin
  carries_query_predicate: 'yes'
  lands: 'conjunct #1; EXISTS(auth_idx) is #2'
  evidence: planner/emit.py:1068
  in_default_registry: true
- n: 10
  template_id: strong_auth_index_keyed_v1
  emitter: _lower_strong_auth_index_keyed
  carries_query_predicate: 'no'
  lands: join + artifact scope only
  evidence: planner/emit.py:1080-1082,1088
  in_default_registry: true
- n: 11
  template_id: auth_index_keyed_semijoin_v1
  emitter: _lower_auth_index_keyed_semijoin
  carries_query_predicate: 'yes'
  lands: 'conjunct #1; EXISTS(auth_idx_keyed) is #2'
  evidence: planner/emit.py:1108
  in_default_registry: true
- n: 12
  template_id: mav_scan_v1
  emitter: _lower_mav_scan
  carries_query_predicate: conditional
  lands: on the MAV alias after a CROSS JOIN {binding} CTE; overridable by template param mav_query_predicate; dropped entirely when the resolved value is in {None, '', 'TRUE', 'true'}
  evidence: planner/emit.py:1158-1161,1166
  in_default_registry: true
- n: 13
  template_id: guard_candidate_plus_residual_v1
  emitter: _lower_guard_candidate
  carries_query_predicate: 'no'
  lands: cand CTE carries guard_predicate_for only
  evidence: planner/emit.py:1038
  in_default_registry: true
- n: 14
  template_id: hybrid_intersect_v1
  emitter: _lower_hybrid_intersect
  carries_query_predicate: 'yes'
  lands: only inside the q AS MATERIALIZED CTE; the outer join body has none
  evidence: planner/emit.py:1186 vs 1178-1182
  in_default_registry: true
