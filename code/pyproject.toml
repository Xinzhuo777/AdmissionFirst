[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caprls-experiments"
version = "0.1.0"
description = "AdmissionFirst experiment code"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
caprls = "caprls_core.cli:main"

[tool.setuptools.packages.find]
include = ["caprls_core*", "planner*"]
