manifest_id: e5_smoke_v1
experiment: E5
stage: smoke
execution_tier: smoke
ae_required: true
timeout_s: 600
repetitions: {warmup: 1, measured: 1}
dataset: {name: synthetic_saas, scale: 1e5, seed: 46}
postgres: {config: configs/pg_smoke.yaml, warm_cache: true}
queries:
  - {query_id: E5_witness_smoke, path: workloads/e5/witness_smoke.sql}
N: [100000]
modes:
  - barrier-only
  - injection-only
  - auth-index-enum-only
  - strong-auth-index
  - mav-only
  - guard-mandatory-discharge
  - contract-aware
  - template-oracle
policy_applications:
  - {policy_id: e5_singleton_document, relation: document}
  - {policy_id: e5_all_document, relation: document}
witnesses:
  - id: barrier_bad_auth_singleton
    witness_kind: regret_witness
    policy_cost: [cheap]
    artifact_configs: [auth_idx]
    theory_witness: W1
    fixed_mode_under_test: barrier-only
    expected_best_mode: auth-index-enum-only
  - id: auth_enum_bad_point_query
    witness_kind: regret_witness
    policy_cost: [cheap]
    artifact_configs: [auth_idx]
    theory_witness: W2
    fixed_mode_under_test: auth-index-enum-only
    expected_best_mode: injection-only
  - id: mav_bad_single_use_refresh
    witness_kind: regret_witness
    policy_cost: [cheap]
    artifact_configs: [mav]
    theory_witness: W3
    fixed_mode_under_test: mav-only
    expected_best_mode: injection-only
    amortization: {Q: 1, U: 0}
  - id: guard_bad_unselective_residual
    witness_kind: regret_witness
    policy_cost: [cheap]
    artifact_configs: [auth_idx]
    theory_witness: W4
    fixed_mode_under_test: guard-mandatory-discharge
    expected_best_mode: auth-index-enum-only
  - id: injection_bad_expensive_singleton
    witness_kind: regret_witness
    policy_cost: [cheap]
    artifact_configs: [auth_idx]
    theory_witness: W5
    fixed_mode_under_test: injection-only
    expected_best_mode: auth-index-enum-only
  - id: mav_good_repeated_dashboard
    witness_kind: positive_control
    policy_cost: [cheap]
    artifact_configs: [mav]
    theory_witness: positive_control
    fixed_mode_under_test: mav-only
    expected_best_mode: mav-only
    amortization: {Q: 10, U: 0}
outputs:
  raw_dir: results/raw/E5/
  summary_dir: results/summarized/E5/
