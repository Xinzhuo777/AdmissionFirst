# Server settings used for every measurement and replay (PostgreSQL 16.11 with
# AdmissionFirst). Append this file to a cluster's postgresql.conf, or pass it
# with `postgres -c config_file=...` after adding data_directory and port.
shared_buffers = '2GB'
work_mem = '16MB'
effective_cache_size = '8GB'
max_wal_size = '4GB'
random_page_cost = '4.0'
seq_page_cost = '1.0'
cpu_tuple_cost = '0.01'
cpu_index_tuple_cost = '0.005'
cpu_operator_cost = '0.0025'
jit = 'off'
max_parallel_workers = '0'
max_parallel_workers_per_gather = '0'
autovacuum = 'off'

# AdmissionFirst settings. The server default mode is ordinary PostgreSQL
# behavior; the replay enables AF per session with SET native_af.mode = 'af'.
native_af.authorization_indexes = 'on'
native_af.max_authorized_keys = '1048576'
native_af.mode = 'native'
native_af.trace = 'off'
